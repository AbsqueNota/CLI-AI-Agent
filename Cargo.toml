[package]
name = "agent-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] } 
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
crossterm = "0.29.0"
dialoguer = "0.12.0"
directories = "6.0.0"
indicatif = "0.18.6"
pulldown-cmark = "0.13.6"
ratatui = "0.30.2"
reqwest = "0.13.5"
rig = "0.46.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_with = "3.24.0"
sysinfo = "0.40.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = {version = "1.29.3", features = ["v4", "v7", "serde"]}
